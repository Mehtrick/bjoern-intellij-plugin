name: Publish Plugin

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Read release version
        id: version
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag such as 1.0.4 or v1.0.4" >&2
            exit 1
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
      - name: Test, package and verify
        run: ./gradlew test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin -PpluginVersion=${{ steps.version.outputs.version }} --console=plain
      - name: Publish plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin -PpluginVersion=${{ steps.version.outputs.version }} --console=plain
      - name: Upload release artifacts and reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plugin-release-${{ steps.version.outputs.version }}
          path: |
            build/distributions/*.zip
            build/reports/tests/test/
            build/reports/pluginVerifier/
