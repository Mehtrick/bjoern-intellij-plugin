name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ide: 2026.1.5.1
            java: 21
          - ide: 2026.2.5
            java: 25
          - ide: 2026.3
            java: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and package for IntelliJ IDEA ${{ matrix.ide }}
        run: ./gradlew test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure -PplatformVersion=${{ matrix.ide }} --console=plain
      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.ide }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin-${{ matrix.ide }}
          path: build/distributions/*.zip

  verify-compatibility:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify the baseline artifact against all supported IDE generations
        run: ./gradlew verifyPlugin --console=plain
      - name: Upload compatibility reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plugin-verifier
          path: build/reports/pluginVerifier/
